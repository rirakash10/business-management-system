<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Products & Stock</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f5f7fb;
    color: #1f2937;
}

.header {
    background: #111827;
    color: white;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 25px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input,
select {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

button {
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    background: #111827;
    color: white;
    font-size: 15px;
}

.delete {
    background: #dc2626;
}

.stock-in {
    background: #16a34a;
    margin-right: 5px;
}

.history {
    background: #2563eb;
}

.product {
    border: 1px solid #e5e7eb;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
}

.low-stock {
    background: #fff1f2;
    border-color: #ef4444;
}

.hidden {
    display: none;
}

.purchase-item {
    border: 1px solid #e5e7eb;
    padding: 12px;
    border-radius: 8px;
    margin-top: 8px;
}

</style>

</head>


<body>


<header class="header">

<h1>📦 Products & Stock</h1>

<p>Inventory Management</p>

</header>


<main class="container">


<div class="card">

<button
onclick="window.location.href='index.html'">

← Dashboard

</button>

</div>


<div class="card">

<h2>➕ নতুন Product যোগ করুন</h2>

<input
id="productName"
type="text"
placeholder="Product Name">


<input
id="quantity"
type="number"
placeholder="Stock Quantity">


<input
id="buyPrice"
type="number"
placeholder="Buying Price">


<input
id="sellPrice"
type="number"
placeholder="Selling Price">


<button onclick="addProduct()">

Add Product

</button>

</div>


<div class="card">

<h2>📥 Stock In / Purchase</h2>

<select id="purchaseProduct">

<option value="">
Product নির্বাচন করুন
</option>

</select>


<input
id="purchaseQuantity"
type="number"
min="1"
placeholder="কত Quantity এসেছে?">


<input
id="purchaseBuyPrice"
type="number"
min="0"
placeholder="Buying Price">


<input
id="supplier"
type="text"
placeholder="Supplier Name (Optional)">


<button
class="stock-in"
onclick="addStock()">

📥 Stock In করুন

</button>

</div>


<div class="card">

<h2>🔎 Product Search</h2>

<input
id="search"
type="text"
placeholder="Product search করুন"
onkeyup="showProducts()">

</div>


<div class="card">

<h2>📦 Product List</h2>

<div id="productList"></div>

</div>


<div class="card">

<h2>🧾 Purchase History</h2>

<div id="purchaseHistory"></div>

</div>


</main>


<script>


function getProducts() {

return JSON.parse(

localStorage.getItem("products") || "[]"

);

}


function saveProducts(products) {

localStorage.setItem(

"products",

JSON.stringify(products)

);

}


function getPurchases() {

return JSON.parse(

localStorage.getItem("purchases") || "[]"

);

}


function savePurchases(purchases) {

localStorage.setItem(

"purchases",

JSON.stringify(purchases)

);

}


/* =====================
   ADD PRODUCT
===================== */

function addProduct() {


const name =

document
.getElementById("productName")
.value
.trim();


const quantity =

Number(
document
.getElementById("quantity")
.value
);


const buyPrice =

Number(
document
.getElementById("buyPrice")
.value
);


const sellPrice =

Number(
document
.getElementById("sellPrice")
.value
);


if (name === "") {

alert("Product Name দিন");

return;

}


if (quantity < 0) {

alert("Stock Quantity সঠিক দিন");

return;

}


const products = getProducts();


products.push({

id: Date.now(),

name: name,

quantity: quantity,

buyPrice: buyPrice,

sellPrice: sellPrice

});


saveProducts(products);


document
.getElementById("productName")
.value = "";


document
.getElementById("quantity")
.value = "";


document
.getElementById("buyPrice")
.value = "";


document
.getElementById("sellPrice")
.value = "";


showProducts();

updatePurchaseProducts();

}


/* =====================
   STOCK IN
===================== */

function addStock() {


const productId =

Number(
document
.getElementById("purchaseProduct")
.value
);


const quantity =

Number(
document
.getElementById("purchaseQuantity")
.value
);


const buyPrice =

Number(
document
.getElementById("purchaseBuyPrice")
.value
);


const supplier =

document
.getElementById("supplier")
.value
.trim();


if (!productId) {

alert("Product নির্বাচন করুন");

return;

}


if (quantity <= 0) {

alert("সঠিক Quantity দিন");

return;

}


if (buyPrice < 0) {

alert("সঠিক Buying Price দিন");

return;

}


let products = getProducts();


const product = products.find(

p => p.id === productId

);


if (!product) {

alert("Product পাওয়া যায়নি");

return;

}


/* Stock increase */

product.quantity =

Number(product.quantity || 0) + quantity;


/* Update buying price */

product.buyPrice = buyPrice;


saveProducts(products);


/* Purchase record */

const purchases = getPurchases();


purchases.push({

id: Date.now(),

productId: product.id,

product: product.name,

quantity: quantity,

buyPrice: buyPrice,

totalCost: quantity * buyPrice,

supplier: supplier,

date: new Date().toLocaleString("bn-BD")

});


savePurchases(purchases);


/* Clear form */

document
.getElementById("purchaseProduct")
.value = "";


document
.getElementById("purchaseQuantity")
.value = "";


document
.getElementById("purchaseBuyPrice")
.value = "";


document
.getElementById("supplier")
.value = "";


showProducts();

showPurchaseHistory();

updatePurchaseProducts();


alert(

"✅ Stock সফলভাবে যোগ হয়েছে!"

);

}


/* =====================
   DELETE PRODUCT
===================== */

function deleteProduct(id) {


if (!confirm(

"এই Product delete করবেন?"

)) {

return;

}


let products = getProducts();


products = products.filter(

product => product.id !== id

);


saveProducts(products);


showProducts();

updatePurchaseProducts();

}


/* =====================
   PRODUCT DROPDOWN
===================== */

function updatePurchaseProducts() {


const products = getProducts();


const select =

document
.getElementById("purchaseProduct");


select.innerHTML =

'<option value="">Product নির্বাচন করুন</option>';


products.forEach(product => {


const option =

document.createElement("option");


option.value = product.id;

option.textContent =

product.name +
" — Stock: " +
product.quantity;


select.appendChild(option);

});

}


/* =====================
   SHOW PRODUCTS
===================== */

function showProducts() {


const products = getProducts();


const search =

document
.getElementById("search")
.value
.toLowerCase();


const list =

document
.getElementById("productList");


const filtered = products.filter(

product =>

product.name
.toLowerCase()
.includes(search)

);


if (filtered.length === 0) {

list.innerHTML =

"<p>কোনো Product পাওয়া যায়নি।</p>";

return;

}


list.innerHTML =

filtered.map(product => {


const lowStock =

product.quantity <= 5;


return `

<div class="product ${
lowStock ? "low-stock" : ""
}">

<h3>
📦 ${product.name}
</h3>

<p>
🔢 Stock:
<strong>
${product.quantity}
</strong>
</p>

<p>
💰 Buying Price:
৳${product.buyPrice}
</p>

<p>
💵 Selling Price:
৳${product.sellPrice}
</p>

${
lowStock

?

"<p>⚠️ Low Stock!</p>"

:

""
}


<button

class="stock-in"

onclick="selectProductForPurchase(${product.id})">

📥 Stock In

</button>


<button

class="delete"

onclick="deleteProduct(${product.id})">

🗑️ Delete

</button>


</div>

`;

}).join("");

}


/* =====================
   SELECT PRODUCT
===================== */

function selectProductForPurchase(id) {


document
.getElementById("purchaseProduct")
.value = id;


document
.querySelector(".card:nth-of-type(3)")
.scrollIntoView({

behavior: "smooth"

});

}


/* =====================
   PURCHASE HISTORY
===================== */

function showPurchaseHistory() {


const purchases = getPurchases();


const history =

document
.getElementById("purchaseHistory");


if (purchases.length === 0) {

history.innerHTML =

"<p>এখনো কোনো Purchase নেই।</p>";

return;

}


history.innerHTML =

purchases
.slice()
.reverse()
.map(purchase => `

<div class="purchase-item">

<strong>
📦 ${purchase.product}
</strong>

<p>
🔢 Quantity: ${purchase.quantity}
</p>

<p>
💰 Buying Price: ৳${purchase.buyPrice}
</p>

<p>
💵 Total Cost: ৳${purchase.totalCost}
</p>

<p>
🏪 Supplier:
${purchase.supplier || "-"}
</p>

<p>
📅 Date:
${purchase.date}
</p>

</div>

`)
.join("");

}


/* =====================
   START
===================== */

showProducts();

updatePurchaseProducts();

showPurchaseHistory();


</script>


</body>

</html>
