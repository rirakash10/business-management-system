<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Business Management System</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7fb;
    color: #1f2937;
}

.header {
    background: #111827;
    color: white;
    padding: 20px 30px;
}

.header h1 {
    font-size: 24px;
}

.header p {
    margin-top: 5px;
    color: #d1d5db;
}

.container {
    padding: 30px;
    max-width: 1200px;
    margin: auto;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card .icon {
    font-size: 30px;
}

.card h3 {
    margin-top: 15px;
    color: #6b7280;
    font-size: 15px;
}

.card h2 {
    margin-top: 8px;
    font-size: 26px;
}

.menu-title {
    margin-bottom: 20px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.menu button {
    border: none;
    background: white;
    padding: 25px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 17px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.menu button:hover {
    background: #f3f4f6;
}

@media(max-width: 800px) {

    .cards,
    .menu {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media(max-width: 500px) {

    .cards,
    .menu {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 15px;
    }

}

</style>

</head>


<body>


<header class="header">

<h1>
Business Management System
</h1>

<p>
ছোট ব্যবসার সম্পূর্ণ ব্যবস্থাপনা
</p>

</header>


<main class="container">


<section class="cards">


<div class="card">

<div class="icon">
💰
</div>

<h3>
মোট বিক্রয়
</h3>

<h2>
৳ <span id="totalSales">0</span>
</h2>

</div>


<div class="card">

<div class="icon">
💸
</div>

<h3>
মোট খরচ
</h3>

<h2>
৳ <span id="totalExpenses">0</span>
</h2>

</div>


<div class="card">

<div class="icon">
📈
</div>

<h3>
মোট লাভ
</h3>

<h2>
৳ <span id="totalProfit">0</span>
</h2>

</div>


<div class="card">

<div class="icon">
🧾
</div>

<h3>
মোট Invoice
</h3>

<h2>
<span id="totalInvoices">0</span>
</h2>

</div>


</section>


<h2 class="menu-title">
Business Modules
</h2>


<section class="menu">


<button
onclick="window.location.href='customers.html'">

👥
<br><br>

Customers

</button>


<button
onclick="window.location.href='products.html'">

📦
<br><br>

Products & Stock

</button>


<button
onclick="window.location.href='sales.html'">

🛒
<br><br>

Sales

</button>


<button
onclick="window.location.href='invoices.html'">

🧾
<br><br>

Invoices

</button>


<button
onclick="window.location.href='expenses.html'">

💸
<br><br>

Expenses

</button>


<button onclick="window.location.href='employees.html'">
    👨‍💼<br><br>Employees
</button>


<button onclick="window.location.href='reports.html'">
    📊<br><br>Reports
</button>

⚙️
<br><br>

Settings

</button>


</section>


</main>


<script>


/* =========================
   SALES DATA
========================= */

function getSales() {

    return JSON.parse(
        localStorage.getItem("sales") || "[]"
    );

}


/* =========================
   EXPENSE DATA
========================= */

function getExpenses() {

    return JSON.parse(
        localStorage.getItem("expenses") || "[]"
    );

}


/* =========================
   DASHBOARD CALCULATION
========================= */

function updateDashboard() {


    const sales = getSales();

    const expenses = getExpenses();


    let totalSales = 0;

    let totalExpenses = 0;


    /* Sales Total */

    sales.forEach(sale => {

        totalSales +=
            Number(sale.total) || 0;

    });


    /* Expense Total */

    expenses.forEach(expense => {

        totalExpenses +=
            Number(expense.amount) || 0;

    });


    /* Profit */

    const profit =
        totalSales - totalExpenses;


    /* Display */

    document.getElementById(
        "totalSales"
    ).innerText = totalSales;


    document.getElementById(
        "totalExpenses"
    ).innerText = totalExpenses;


    document.getElementById(
        "totalProfit"
    ).innerText = profit;


    document.getElementById(
        "totalInvoices"
    ).innerText = sales.length;

}


/* Run */

updateDashboard();


</script>


</body>

</html>
