<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Invoice Management</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f5f7fb;
    color: #1f2937;
}

.header {
    background: #111827;
    color: white;
    padding: 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

button {
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.dashboard-btn {
    background: white;
    color: #111827;
    margin-top: 12px;
}

.print-btn {
    background: #111827;
    color: white;
    margin-top: 15px;
}

.invoice {
    border: 1px solid #ddd;
    padding: 30px;
    margin-top: 20px;
    border-radius: 10px;
    background: white;
}

.invoice-header {
    display: flex;
    justify-content: space-between;
    gap: 30px;
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 2px solid #111827;
}

.invoice-title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
}

.business-name {
    font-size: 22px;
    font-weight: bold;
}

.business-details {
    margin-top: 8px;
    line-height: 1.7;
    color: #4b5563;
}

.invoice-meta {
    text-align: right;
    line-height: 1.8;
}

.invoice-info {
    margin: 20px 0;
    padding: 15px;
    background: #f9fafb;
    border-radius: 8px;
    line-height: 1.8;
}

.customer-title {
    font-weight: bold;
    font-size: 16px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th,
td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: left;
}

th {
    background: #f3f4f6;
}

.total-section {
    margin-top: 20px;
    margin-left: auto;
    max-width: 350px;
    line-height: 2;
}

.total-row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #eee;
    padding: 4px 0;
}

.grand-total {
    font-size: 20px;
    font-weight: bold;
}

.due-row {
    color: #dc2626;
    font-weight: bold;
}

.payment-info {
    margin-top: 20px;
    padding: 15px;
    background: #f9fafb;
    border-radius: 8px;
}

.thank-you {
    margin-top: 35px;
    padding-top: 20px;
    border-top: 1px solid #ddd;
    text-align: center;
    color: #6b7280;
}

.invoice-list {
    margin-top: 20px;
}

.invoice-item {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 8px;
}

.invoice-item strong {
    font-size: 16px;
}

@media(max-width: 700px) {

    .invoice-header {
        flex-direction: column;
    }

    .invoice-meta {
        text-align: left;
    }

    .invoice {
        padding: 15px;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 8px;
    }

}

@media print {

    body {
        background: white;
    }

    .header,
    .invoice-list,
    .card > h2,
    .no-print {
        display: none !important;
    }

    .container {
        padding: 0;
        max-width: 100%;
    }

    .card {
        box-shadow: none;
        border: none;
        padding: 0;
    }

    .invoice {
        border: none;
        padding: 10px;
    }

}

</style>

</head>


<body>


<header class="header">

<h1>🧾 Invoice Management</h1>

<button
class="dashboard-btn"
onclick="window.location.href='index.html'">

← Dashboard

</button>

</header>


<main class="container">


<div class="card no-print">

<h2>📋 Sales থেকে Invoice</h2>

<div id="salesList">

<p>Sales load হচ্ছে...</p>

</div>

</div>


<div class="card">

<h2 class="no-print">
🧾 Invoice Preview
</h2>

<div id="invoiceArea">

<p>
উপরের তালিকা থেকে একটি Sale নির্বাচন করুন।
</p>

</div>

</div>


</main>


<script>


// ========================================
// SALES DATA
// ========================================

function getSales() {

    return JSON.parse(
        localStorage.getItem("sales") || "[]"
    );

}


// ========================================
// BUSINESS SETTINGS
// ========================================

function getBusinessSettings() {

    return JSON.parse(
        localStorage.getItem("businessSettings") || "{}"
    );

}


// ========================================
// SHOW SALES
// ========================================

function showSales() {

    const sales = getSales();

    const list =
        document.getElementById("salesList");


    if (sales.length === 0) {

        list.innerHTML =
            "<p>এখনও কোনো Sale পাওয়া যায়নি। আগে একটি Sale তৈরি করুন।</p>";

        return;

    }


    let html = "";


    sales.forEach(sale => {

        html += `

        <div class="invoice-item">

            <strong>
            ${sale.product}
            </strong>

            <br><br>

            👤 Customer:
            ${sale.customer}

            <br>

            📞 Phone:
            ${sale.customerPhone || "-"}

            <br>

            💰 Total:
            ৳ ${sale.total}

            <br>

            💵 Paid:
            ৳ ${sale.paid}

            <br>

            ⚠️ Due:
            ৳ ${sale.due}

            <br>

            💳 Payment:
            ${sale.paymentMethod || "-"}

            <br><br>

            <button
            class="print-btn"
            onclick="createInvoice(${sale.id})">

            🧾 Invoice তৈরি করুন

            </button>

        </div>

        `;

    });


    list.innerHTML = html;

}


// ========================================
// CREATE INVOICE
// ========================================

function createInvoice(id) {

    const sales = getSales();


    const sale =
        sales.find(
            item => item.id === id
        );


    if (!sale) {

        alert("Sale পাওয়া যায়নি।");

        return;

    }


    // Business Settings

    const settings =
        getBusinessSettings();


    // Professional Invoice Number

    const invoiceNumber =
        "INV-" +
        new Date().getFullYear() +
        "-" +
        String(sale.id).slice(-6);


    const invoiceArea =
        document.getElementById("invoiceArea");


    // Business Information

    const businessName =
        settings.name ||
        "Business Management System";


    const businessPhone =
        settings.phone || "";


    const businessEmail =
        settings.email || "";


    const businessWebsite =
        settings.website || "";


    const businessAddress =
        settings.address || "";


    const businessDescription =
        settings.description || "";


    invoiceArea.innerHTML = `

    <div class="invoice">


        <!-- ==================================
             INVOICE HEADER
        ================================== -->

        <div class="invoice-header">

            <div>

                <div class="invoice-title">
                    INVOICE
                </div>


                <div class="business-name">
                    ${businessName}
                </div>


                <div class="business-details">

                    ${
                        businessDescription
                        ? businessDescription + "<br>"
                        : ""
                    }


                    ${
                        businessPhone
                        ? "📞 " + businessPhone + "<br>"
                        : ""
                    }


                    ${
                        businessEmail
                        ? "📧 " + businessEmail + "<br>"
                        : ""
                    }


                    ${
                        businessWebsite
                        ? "🌐 " + businessWebsite + "<br>"
                        : ""
                    }


                    ${
                        businessAddress
                        ? "📍 " + businessAddress
                        : ""
                    }

                </div>

            </div>


            <div class="invoice-meta">

                <strong>
                Invoice No:
                </strong>

                ${invoiceNumber}

                <br>

                <strong>
                Date:
                </strong>

                ${sale.date}

            </div>

        </div>


        <!-- ==================================
             CUSTOMER INFORMATION
        ================================== -->

        <div class="invoice-info">

            <div class="customer-title">
                BILL TO
            </div>


            👤 <strong>Customer:</strong>
            ${sale.customer}

            <br>


            📞 <strong>Phone:</strong>
            ${sale.customerPhone || "-"}

        </div>


        <!-- ==================================
             PRODUCT TABLE
        ================================== -->

        <table>

            <tr>

                <th>
                Product
                </th>

                <th>
                Quantity
                </th>

                <th>
                Unit Price
                </th>

                <th>
                Total
                </th>

            </tr>


            <tr>

                <td>
                ${sale.product}
                </td>

                <td>
                ${sale.quantity}
                </td>

                <td>
                ৳ ${sale.price}
                </td>

                <td>
                ৳ ${sale.total}
                </td>

            </tr>

        </table>


        <!-- ==================================
             PAYMENT INFORMATION
        ================================== -->

        <div class="payment-info">

            <strong>
            💳 Payment Method:
            </strong>

            ${sale.paymentMethod || "-"}

        </div>


        <!-- ==================================
             TOTAL SECTION
        ================================== -->

        <div class="total-section">


            <div class="total-row">

                <span>
                Subtotal
                </span>

                <span>
                ৳ ${sale.total}
                </span>

            </div>


            <div class="total-row grand-total">

                <span>
                Total
                </span>

                <span>
                ৳ ${sale.total}
                </span>

            </div>


            <div class="total-row">

                <span>
                Paid
                </span>

                <span>
                ৳ ${sale.paid}
                </span>

            </div>


            <div class="total-row due-row">

                <span>
                Due
                </span>

                <span>
                ৳ ${sale.due}
                </span>

            </div>


        </div>


        <!-- ==================================
             THANK YOU
        ================================== -->

        <div class="thank-you">

            Thank you for your business! ❤️

            <br>

            ${
                businessName
                ? businessName
                : "Business Management System"
            }

        </div>


        <!-- ==================================
             PRINT
        ================================== -->

        <button
        class="print-btn no-print"
        onclick="window.print()">

        🖨️ Print Invoice

        </button>


    </div>

    `;


    window.scrollTo({

        top: document.body.scrollHeight,

        behavior: "smooth"

    });

}


// ========================================
// LOAD SALES
// ========================================

showSales();


</script>


</body>

</html>
