<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sales Management</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f5f7fb;
    color: #1f2937;
}

.header {
    background: #111827;
    color: white;
    padding: 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    margin-top: 15px;
}

.add-btn {
    background: #111827;
    color: white;
}

.delete-btn {
    background: #dc2626;
    color: white;
    padding: 7px 12px;
    margin: 0;
}

.dashboard-btn {
    background: white;
    color: #111827;
}

.total-box {
    margin-top: 20px;
    padding: 15px;
    background: #f3f4f6;
    border-radius: 8px;
    font-size: 18px;
}

.stock-info {
    margin-top: 8px;
    color: #6b7280;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f3f4f6;
}

@media(max-width: 700px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header class="header">

<h1>🛒 Sales Management</h1>

<button
class="dashboard-btn"
onclick="window.location.href='index.html'">

← Dashboard

</button>

</header>


<main class="container">


<div class="card">

<h2>➕ নতুন Sale তৈরি করুন</h2>


<div class="form-grid">


<div>

<label>Customer Name</label>

<input
type="text"
id="customer"
placeholder="Customer-এর নাম">

</div>


<div>

<label>Customer Phone</label>

<input
type="tel"
id="customerPhone"
placeholder="01XXXXXXXXX">

</div>


<div>

<label>Product</label>

<select
id="product"
onchange="productSelected()">

<option value="">
-- Product নির্বাচন করুন --

</option>

</select>

<div
id="stockInfo"
class="stock-info">

Stock: -

</div>

</div>


<div>

<label>Quantity</label>

<input
type="number"
id="quantity"
value="1"
min="1"
oninput="calculateTotal()">

</div>


<div>

<label>Sale Price</label>

<input
type="number"
id="price"
readonly>

</div>


<div>

<label>Paid Amount</label>

<input
type="number"
id="paid"
value="0"
oninput="calculateDue()">

</div>


<div>

<label>Payment Method</label>

<select id="paymentMethod">

<option value="Cash">
💵 Cash
</option>

<option value="bKash">
📱 bKash
</option>

<option value="Nagad">
📱 Nagad
</option>

<option value="Card">
💳 Card
</option>

<option value="Bank">
🏦 Bank
</option>

<option value="Other">
🔹 Other
</option>

</select>

</div>


</div>


<div class="total-box">

<strong>Total:</strong>

৳ <span id="total">0</span>

<br><br>

<strong>Due:</strong>

৳ <span id="due">0</span>

</div>


<button
class="add-btn"
onclick="addSale()">

💾 Sale Save করুন

</button>


</div>


<div class="card">

<h2>📋 Sales History</h2>

<div id="salesList"></div>

</div>


</main>


<script>


function getProducts() {

    return JSON.parse(
        localStorage.getItem("products") || "[]"
    );

}


function saveProducts(products) {

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

}


function getSales() {

    return JSON.parse(
        localStorage.getItem("sales") || "[]"
    );

}


function saveSales(sales) {

    localStorage.setItem(
        "sales",
        JSON.stringify(sales)
    );

}


function loadProducts() {

    const products = getProducts();

    const select =
        document.getElementById("product");


    products.forEach(product => {

        const option =
            document.createElement("option");

        option.value = product.id;

        option.textContent =
            product.name +
            " — Stock: " +
            product.quantity;

        select.appendChild(option);

    });

}


function productSelected() {

    const id =
        Number(
            document.getElementById("product").value
        );


    const products = getProducts();


    const product =
        products.find(
            item => item.id === id
        );


    if (!product) {

        document.getElementById("price").value = "";

        document.getElementById("stockInfo").innerText =
            "Stock: -";

        return;

    }


    document.getElementById("price").value =
        product.sellPrice;


    document.getElementById("stockInfo").innerText =
        "বর্তমান Stock: " + product.quantity;


    calculateTotal();

}


function calculateTotal() {

    const quantity =
        Number(
            document.getElementById("quantity").value
        ) || 0;


    const price =
        Number(
            document.getElementById("price").value
        ) || 0;


    const total =
        quantity * price;


    document.getElementById("total").innerText =
        total;


    calculateDue();

}


function calculateDue() {

    const total =
        Number(
            document.getElementById("total").innerText
        ) || 0;


    const paid =
        Number(
            document.getElementById("paid").value
        ) || 0;


    const due =
        Math.max(total - paid, 0);


    document.getElementById("due").innerText =
        due;

}


function addSale() {


    const customer =
        document.getElementById("customer").value.trim();


    const customerPhone =
        document.getElementById("customerPhone").value.trim();


    const productId =
        Number(
            document.getElementById("product").value
        );


    const quantity =
        Number(
            document.getElementById("quantity").value
        );


    const paid =
        Number(
            document.getElementById("paid").value
        ) || 0;


    const paymentMethod =
        document.getElementById("paymentMethod").value;


    if (!customer) {

        alert("Customer Name দিন");

        return;

    }


    if (!productId) {

        alert("Product নির্বাচন করুন");

        return;

    }


    if (!quantity || quantity <= 0) {

        alert("সঠিক Quantity দিন");

        return;

    }


    const products = getProducts();


    const product =
        products.find(
            item => item.id === productId
        );


    if (!product) {

        alert("Product পাওয়া যায়নি");

        return;

    }


    if (quantity > product.quantity) {

        alert(
            "❌ পর্যাপ্ত Stock নেই। বর্তমান Stock: "
            + product.quantity
        );

        return;

    }


    const price =
        Number(product.sellPrice);


    const total =
        quantity * price;


    const due =
        Math.max(total - paid, 0);


    /* Stock কমানো */

    product.quantity -= quantity;


    saveProducts(products);


    /* Sale Save */

    const sale = {

        id: Date.now(),

        customer: customer,

        customerPhone: customerPhone,

        productId: product.id,

        product: product.name,

        quantity: quantity,

        price: price,

        total: total,

        paid: paid,

        due: due,

        paymentMethod: paymentMethod,

        date: new Date().toLocaleString("bn-BD")

    };


    const sales = getSales();


    sales.push(sale);


    saveSales(sales);


    alert(
        "✅ Sale সফলভাবে Save হয়েছে এবং Stock আপডেট হয়েছে।"
    );


    document.getElementById("customer").value = "";

    document.getElementById("customerPhone").value = "";

    document.getElementById("product").value = "";

    document.getElementById("quantity").value = "1";

    document.getElementById("price").value = "";

    document.getElementById("paid").value = "0";

    document.getElementById("paymentMethod").value = "Cash";

    document.getElementById("stockInfo").innerText =
        "Stock: -";

    document.getElementById("total").innerText =
        "0";

    document.getElementById("due").innerText =
        "0";


    showSales();

    refreshProductDropdown();

}


function deleteSale(id) {


    if (!confirm(
        "এই Sale delete করতে চান?"
    )) {

        return;

    }


    let sales = getSales();


    const sale =
        sales.find(
            item => item.id === id
        );


    if (sale) {

        const products = getProducts();


        const product =
            products.find(
                item => item.id === sale.productId
            );


        if (product) {

            product.quantity += sale.quantity;

            saveProducts(products);

        }

    }


    sales =
        sales.filter(
            item => item.id !== id
        );


    saveSales(sales);


    showSales();

    refreshProductDropdown();

}


function showSales() {

    const sales = getSales();


    const list =
        document.getElementById("salesList");


    if (sales.length === 0) {

        list.innerHTML =
            "<p>এখনও কোনো Sale তৈরি হয়নি।</p>";

        return;

    }


    let html = `

    <table>

    <tr>

    <th>Date</th>

    <th>Customer</th>

    <th>Phone</th>

    <th>Product</th>

    <th>Qty</th>

    <th>Total</th>

    <th>Paid</th>

    <th>Due</th>

    <th>Payment</th>

    <th>Action</th>

    </tr>

    `;


    sales.forEach(sale => {

        html += `

        <tr>

        <td>${sale.date}</td>

        <td>${sale.customer}</td>

        <td>${sale.customerPhone || "-"}</td>

        <td>${sale.product}</td>

        <td>${sale.quantity}</td>

        <td>৳ ${sale.total}</td>

        <td>৳ ${sale.paid}</td>

        <td>৳ ${sale.due}</td>

        <td>${sale.paymentMethod || "-"}</td>

        <td>

        <button
        class="delete-btn"
        onclick="deleteSale(${sale.id})">

        Delete

        </button>

        </td>

        </tr>

        `;

    });


    html += "</table>";


    list.innerHTML = html;

}


function refreshProductDropdown() {

    const select =
        document.getElementById("product");


    select.innerHTML = `

    <option value="">

    -- Product নির্বাচন করুন --

    </option>

    `;


    loadProducts();

}


loadProducts();

showSales();


</script>


</body>

</html>
