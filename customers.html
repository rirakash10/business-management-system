```html
<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Customer Management</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f5f7fb;
    color: #1f2937;
}

.header {
    background: #111827;
    color: white;
    padding: 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

button {
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    background: #111827;
    color: white;
    font-size: 15px;
}

.delete {
    background: #dc2626;
}

.history-btn {
    background: #2563eb;
    margin-left: 5px;
}

.payment-btn {
    background: #16a34a;
    margin-left: 5px;
}

.customer {
    border: 1px solid #e5e7eb;
    padding: 18px;
    border-radius: 10px;
    margin-top: 12px;
}

.customer h3 {
    margin-top: 0;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.stat {
    background: #f3f4f6;
    padding: 12px;
    border-radius: 8px;
}

.stat strong {
    display: block;
    margin-bottom: 5px;
}

.due {
    color: #dc2626;
    font-weight: bold;
}

.paid {
    color: #16a34a;
    font-weight: bold;
}

.sales-history {
    display: none;
    margin-top: 15px;
    overflow-x: auto;
}

.sales-history table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

.sales-history th,
.sales-history td {
    padding: 10px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

.sales-history th {
    background: #f3f4f6;
}

.empty {
    color: #6b7280;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.summary-box {
    padding: 20px;
    border-radius: 10px;
    background: #f3f4f6;
}

.summary-box h3 {
    margin-top: 0;
}

@media(max-width: 700px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .summary {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header class="header">

<h1>👥 Customer Management</h1>

<p>Business Management System</p>

</header>


<main class="container">


<!-- DASHBOARD BUTTON -->

<div class="card">

<button onclick="window.location.href='index.html'">
← Dashboard
</button>

</div>


<!-- ADD CUSTOMER -->

<div class="card">

<h2>➕ নতুন Customer যোগ করুন</h2>

<input
id="name"
type="text"
placeholder="Customer Name"
>

<input
id="phone"
type="text"
placeholder="Mobile Number"
>

<input
id="address"
type="text"
placeholder="Address"
>

<button onclick="addCustomer()">
Add Customer
</button>

</div>


<!-- SEARCH -->

<div class="card">

<h2>🔎 Customer Search</h2>

<input
id="search"
type="text"
placeholder="নাম অথবা মোবাইল দিয়ে Search করুন"
onkeyup="showCustomers()"
>

</div>


<!-- CUSTOMER SUMMARY -->

<div class="card">

<h2>📊 Customer Summary</h2>

<div class="summary">

<div class="summary-box">

<h3>👥 Total Customers</h3>

<strong id="totalCustomers">
0
</strong>

</div>


<div class="summary-box">

<h3>💰 Total Sales</h3>

<strong id="customerTotalSales">
৳ 0
</strong>

</div>


<div class="summary-box">

<h3>🔴 Total Due</h3>

<strong
id="customerTotalDue"
class="due">

৳ 0

</strong>

</div>

</div>

</div>


<!-- CUSTOMER LIST -->

<div class="card">

<h2>👥 Customer List</h2>

<div id="customerList"></div>

</div>


</main>


<script>


/* =========================
   CUSTOMERS
========================= */

function getCustomers() {

    return JSON.parse(
        localStorage.getItem("customers") || "[]"
    );

}


function saveCustomers(customers) {

    localStorage.setItem(
        "customers",
        JSON.stringify(customers)
    );

}


/* =========================
   SALES
========================= */

function getSales() {

    return JSON.parse(
        localStorage.getItem("sales") || "[]"
    );

}


/* =========================
   PAYMENTS
========================= */

function getPayments() {

    return JSON.parse(
        localStorage.getItem("payments") || "[]"
    );

}


/* =========================
   ADD CUSTOMER
========================= */

function addCustomer() {

    const name =
        document.getElementById("name")
        .value
        .trim();


    const phone =
        document.getElementById("phone")
        .value
        .trim();


    const address =
        document.getElementById("address")
        .value
        .trim();


    if (name === "") {

        alert("Customer Name দিন");

        return;

    }


    const customers = getCustomers();


    const alreadyExists =
        customers.some(customer =>

            String(customer.name || "")
            .toLowerCase() ===
            name.toLowerCase() &&

            String(customer.phone || "") ===
            phone

        );


    if (alreadyExists) {

        alert(
            "⚠️ এই Customer আগে থেকেই আছে।"
        );

        return;

    }


    customers.push({

        id: Date.now(),

        name: name,

        phone: phone,

        address: address

    });


    saveCustomers(customers);


    document.getElementById("name").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("address").value = "";


    showCustomers();


    alert(
        "✅ Customer সফলভাবে যোগ হয়েছে।"
    );

}


/* =========================
   DELETE CUSTOMER
========================= */

function deleteCustomer(id) {

    if (!confirm(
        "এই Customer delete করবেন?"
    )) {

        return;

    }


    let customers = getCustomers();


    customers =
        customers.filter(
            customer =>
                Number(customer.id) !== Number(id)
        );


    saveCustomers(customers);


    showCustomers();

}


/* =========================
   CUSTOMER SALES
========================= */

function getCustomerSales(customer) {

    const sales = getSales();


    return sales.filter(sale => {

        if (
            sale.customerId &&
            Number(sale.customerId) ===
            Number(customer.id)
        ) {

            return true;

        }


        return (
            String(sale.customer || "")
            .toLowerCase() ===
            String(customer.name || "")
            .toLowerCase()
        );

    });

}


/* =========================
   CUSTOMER PAYMENTS
========================= */

function getCustomerPayments(customer) {

    const payments =
        getPayments();


    return payments.filter(payment => {

        return (
            Number(payment.customerId) ===
            Number(customer.id)
        );

    });

}


/* =========================
   CUSTOMER STATS
========================= */

function getCustomerStats(customer) {

    const sales =
        getCustomerSales(customer);


    const payments =
        getCustomerPayments(customer);


    let total = 0;

    let paidFromSales = 0;

    let originalDue = 0;

    let separatePayments = 0;


    sales.forEach(sale => {

        total +=
            Number(sale.total) || 0;

        paidFromSales +=
            Number(sale.paid) || 0;

        originalDue +=
            Number(sale.due) || 0;

    });


    payments.forEach(payment => {

        separatePayments +=
            Number(payment.amount) || 0;

    });


    const currentDue =
        Math.max(
            originalDue - separatePayments,
            0
        );


    const totalPaid =
        paidFromSales + separatePayments;


    return {

        salesCount: sales.length,

        total: total,

        paid: totalPaid,

        originalDue: originalDue,

        payments: separatePayments,

        due: currentDue

    };

}


/* =========================
   HISTORY TOGGLE
========================= */

function toggleHistory(id) {

    const element =
        document.getElementById(
            "history-" + id
        );


    if (!element) return;


    if (
        element.style.display === "none" ||
        element.style.display === ""
    ) {

        element.style.display = "block";

    } else {

        element.style.display = "none";

    }

}


/* =========================
   PAYMENT PAGE
========================= */

function openPaymentPage() {

    window.location.href =
        "payments.html";

}


/* =========================
   SHOW CUSTOMER
========================= */

function showCustomers() {

    const customers =
        getCustomers();


    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const list =
        document.getElementById(
            "customerList"
        );


    const filtered =
        customers.filter(customer =>

            String(customer.name || "")
            .toLowerCase()
            .includes(search)

            ||

            String(customer.phone || "")
            .toLowerCase()
            .includes(search)

        );


    /* SUMMARY */

    document.getElementById(
        "totalCustomers"
    ).innerText =
        customers.length;


    let allSales = 0;

    let allDue = 0;


    customers.forEach(customer => {

        const stats =
            getCustomerStats(customer);


        allSales +=
            stats.total;


        allDue +=
            stats.due;

    });


    document.getElementById(
        "customerTotalSales"
    ).innerText =
        "৳ " + allSales;


    document.getElementById(
        "customerTotalDue"
    ).innerText =
        "৳ " + allDue;


    /* NO CUSTOMER */

    if (filtered.length === 0) {

        list.innerHTML =
            "<p class='empty'>এখনো কোনো Customer যোগ করা হয়নি।</p>";

        return;

    }


    /* CUSTOMER CARDS */

    list.innerHTML =
        filtered.map(customer => {

            const stats =
                getCustomerStats(customer);


            const sales =
                getCustomerSales(customer);


            let historyHTML = "";


            if (sales.length === 0) {

                historyHTML = `
                    <p class="empty">
                    এই Customer-এর কোনো Sale History নেই।
                    </p>
                `;

            } else {

                historyHTML = `

                <table>

                <tr>

                <th>Date</th>

                <th>Product</th>

                <th>Qty</th>

                <th>Total</th>

                <th>Paid</th>

                <th>Due</th>

                <th>Payment</th>

                </tr>

                `;


                sales
                .slice()
                .reverse()
                .forEach(sale => {

                    historyHTML += `

                    <tr>

                    <td>
                    ${sale.date || "-"}
                    </td>

                    <td>
                    ${sale.product || "-"}
                    </td>

                    <td>
                    ${sale.quantity || 0}
                    </td>

                    <td>
                    ৳ ${Number(sale.total) || 0}
                    </td>

                    <td class="paid">
                    ৳ ${Number(sale.paid) || 0}
                    </td>

                    <td class="due">
                    ৳ ${Number(sale.due) || 0}
                    </td>

                    <td>
                    ${sale.paymentMethod || "-"}
                    </td>

                    </tr>

                    `;

                });


                historyHTML += "</table>";

            }


            return `

            <div class="customer">

                <h3>
                👤 ${customer.name}
                </h3>


                <p>
                📞 ${customer.phone || "নম্বর নেই"}
                </p>


                <p>
                📍 ${customer.address || "ঠিকানা নেই"}
                </p>


                <div class="stats">

                    <div class="stat">

                        <strong>
                        🧾 Total Sale
                        </strong>

                        ${stats.salesCount}

                    </div>


                    <div class="stat">

                        <strong>
                        💰 Total
                        </strong>

                        ৳ ${stats.total}

                    </div>


                    <div class="stat">

                        <strong>
                        ✅ Paid
                        </strong>

                        <span class="paid">
                        ৳ ${stats.paid}
                        </span>

                    </div>


                    <div class="stat">

                        <strong>
                        🔴 Current Due
                        </strong>

                        <span class="due">
                        ৳ ${stats.due}
                        </span>

                    </div>

                </div>


                <button
                    class="history-btn"
                    onclick="toggleHistory(${customer.id})">

                    📋 Sales History

                </button>


                <button
                    class="payment-btn"
                    onclick="openPaymentPage()">

                    💰 Due Payment

                </button>


                <button
                    class="delete"
                    onclick="deleteCustomer(${customer.id})">

                    🗑️ Delete

                </button>


                <div
                    id="history-${customer.id}"
                    class="sales-history">

                    ${historyHTML}

                </div>

            </div>

            `;

        })
        .join("");

}


/* =========================
   START
========================= */

showCustomers();

</script>


</body>

</html>
```
